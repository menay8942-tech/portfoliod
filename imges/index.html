<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cupcake House</title>
<link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f8b5d8;font-family:sans-serif;width:100%;overflow-x:hidden}
header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px;background:#f8d1e8}
.log h1{color:#d81b60;font-size:20px}
.icon-cart{position:relative;cursor:pointer}
.icon-cart img{width:38px;height:38px;border-radius:50%;border:2px solid #d81b60}
#cart-count{position:absolute;top:-6px;right:-6px;background:#ff0095;color:#fff;width:18px;height:18px;border-radius:50%;display:none;justify-content:center;align-items:center;font-size:11px}
.title{display:flex;justify-content:center;align-items:center;gap:8px;padding:15px;text-align:center}
.title h3{color:#d81b60;font-size:18px}
.title img{width:30px;border-radius:50%}
.swiper{width:100%;padding:20px 0 40px 0}
.swiper-slide{width:200px !important;display:flex;justify-content:center}
.tranding-slide-img{position:relative;width:180px;height:180px}
.tranding-slide-img img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff}
.add-to-cart{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);background:#ff0095;color:#fff;border:none;padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer}
#cart-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;justify-content:center;align-items:center}
#cart-modal.active{display:flex}
.cart-content{background:#fff0f7;padding:15px;border-radius:20px;width:90%;max-width:340px}
.cart-item{display:flex;align-items:center;gap:10px;background:#fff;padding:8px;border-radius:10px;margin-bottom:8px}
.cart-item img{width:35px;height:35px;border-radius:50%}
#close-cart{float:right;font-size:26px;color:#d81b60;cursor:pointer}
#send-order{width:100%;background:#25D366;color:#fff;border:none;padding:10px;border-radius:20px;margin-top:10px}
</style>
</head>
<body>
<header>
<div class="log"><h1>Cupcake house</h1></div>
<div class="icon-cart" id="open-cart"><img src="imges/WhatsApp Image 2026-10-02 at 12.43.10 AM.jpeg"><span id="cart-count">0</span></div>
</header>
<div class="title"><h3>Enjoy tasty Cupcake</h3><img src="imges/WhatsApp Image 2026-10-02 at 12.43.11 AM (1).jpeg"></div>

<div class="swiper tranding-slider">
<div class="swiper-wrapper">
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/WhatsApp Image 2026-10-02 at 12.43.11 AM (2).jpeg"><button class="add-to-cart" data-name="Blue Cupcake">Add to cart</button></div></div>
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/WhatsApp Image 2026-10-02 at 12.43.11 AM (3).jpeg"><button class="add-to-cart" data-name="Pink Cupcake">Add to cart</button></div></div>
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/WhatsApp Image 2026-10-02 at 12.43.11 AM (4).jpeg"><button class="add-to-cart" data-name="Choco Cupcake">Add to cart</button></div></div>
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/WhatsApp Image 2026-10-02 at 12.43.11 AM.jpeg"><button class="add-to-cart" data-name="Party Cupcake">Add to cart</button></div></div>
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/1.jpeg"><button class="add-to-cart" data-name="Vanilla">Add to cart</button></div></div>
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/2.jpeg"><button class="add-to-cart" data-name="Strawberry">Add to cart</button></div></div>
<div class="swiper-slide"><div class="tranding-slide-img"><img src="imges/3.jpeg"><button class="add-to-cart" data-name="Special">Add to cart</button></div></div>
</div>
</div>

<div id="cart-modal"><div class="cart-content"><span id="close-cart">&times;</span><h2 style="text-align:center;color:#d81b60;margin-bottom:10px">السلة 🧁</h2><div id="cart-items"></div><button id="send-order">ابعت الاوردر واتساب</button></div></div>

<script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
<script>
var slider = new Swiper('.tranding-slider',{effect:'coverflow',grabCursor:true,centeredSlides:true,loop:true,slidesPerView:'auto',coverflowEffect:{rotate:0,stretch:0,depth:100,modifier:2.5}});
let cart=[]; const countEl=document.getElementById('cart-count'); const modal=document.getElementById('cart-modal'); const itemsEl=document.getElementById('cart-items');
document.querySelectorAll('.add-to-cart').forEach(b=>{b.addEventListener('click',e=>{e.stopPropagation();cart.push({name:e.target.dataset.name,img:e.target.parentElement.querySelector('img').src});countEl.textContent=cart.length;countEl.style.display='flex';render();})});
function render(){itemsEl.innerHTML='';if(cart.length==0){itemsEl.innerHTML='<p style="text-align:center">فاضية</p>';return}cart.forEach((it,i)=>{itemsEl.innerHTML+=`<div class="cart-item"><img src="${it.img}"><span>${it.name}</span><button onclick="cart.splice(${i},1);document.getElementById('cart-count').textContent=cart.length;render()" style="margin-left:auto;border:none;background:none;color:red">X</button></div>`})}
document.getElementById('open-cart').onclick=()=>modal.classList.add('active');
document.getElementById('close-cart').onclick=()=>modal.classList.remove('active');
modal.onclick=e=>{if(e.target==modal)modal.classList.remove('active')};
document.getElementById('send-order').onclick=()=>{if(!cart.length)return alert('فاضية');let m='عايز اطلب:\n';cart.forEach(x=>m+='- '+x.name+'\n');window.open('https://wa.me/201234567890?text='+encodeURIComponent(m))};
</script>
</body>
</html>
